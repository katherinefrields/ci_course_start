name: Pages Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev,docs]"

    - name: Test with pytest
      run: |
        pytest

  build-docs:
    needs: tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev,docs]"

    - name: Build Docs
      run: |
        sphinx-build -W -b html docs docs/_build/html

    - uses: actions/configure-pages@v4

    - uses: actions/upload-pages-artifact@v4
      with:
        path: docs/_build/html

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install -e ".[dev,docs]"

    - name: Deploy Github Pages
      id: deployment
      uses: actions/deploy-pages@v5

    - name: Upload documentation preview test
      uses: actions/upload-artifact@v7
      with:
        name: documentation-preview
        path: docs/_build/html
        if-no-files-found: error
        retention-days: 7
