name: Pages Workflow

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  basic-job:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install .[docs, dev]

    - name: Check Pre-Commit
      run: |
        pre-commit run --all-files
